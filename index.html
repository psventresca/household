<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<title>Household</title>
<style>
:root { color-scheme: light; --page: #f5f6f8; --card: #ffffff; --ink: #1b1f27; --ink-2: #5a6272; --ring: rgba(20,30,50,.12); --accent: #2f4f9e; --bad: #b3261e; }
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; --page: #14161b; --card: #1d2027; --ink: #eceef2; --ink-2: #a8afbd; --ring: rgba(255,255,255,.12); --accent: #8fb0ff; --bad: #ff8a80; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: var(--ink); background: var(--page);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--ring); border-radius: 14px; padding: 24px; }
h1 { font-size: 1.3rem; margin: 0 0 16px; }
label { display: block; font-size: .9rem; margin-bottom: 6px; }
input[type=password] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--ring); background: var(--page); color: var(--ink); }
.row { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: .9rem; color: var(--ink-2); }
button { width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
@media (prefers-color-scheme: dark) { button { color: #10131a; } }
#msg { min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; color: var(--ink-2); }
#msg.bad { color: var(--bad); }
</style>
</head>
<body>
<form id="lock" hidden>
  <h1>Household</h1>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>

  <button type="submit">Open</button>
  <p id="msg" role="status"></p>
</form>

  const bytes = Uint8Array.from(atob(BLOB), (c) => c.charCodeAt(0));

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ITERATIONS, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
    return new TextDecoder().decode(plain);
  }
  async function show(html, remembered) {
    // swap pages only once the lock screen has finished loading, or the browser
    // writes the page into the lock screen instead of replacing it
    if (document.readyState !== "complete") await new Promise((r) => window.addEventListener("load", r, { once: true }));
    window.__FIN_REMEMBERED__ = remembered;
    window.__FIN_FORGET__ = function () { store.clear(); location.reload(); };
    document.open(); document.write(html); document.close();
  }

  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg");
    msg.className = ""; msg.textContent = "Checking…";
    try {
      const key = await deriveKey($("pw").value);
      let html;
      try { html = await open(key); } catch (err) {
        msg.className = "bad"; msg.textContent = "That password didn't work.";
        return;
      }
      if ($("remember").checked) {
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        store.set(btoa(String.fromCharCode.apply(null, raw)));
      } else {
        store.clear();
      }
      await show(html, $("remember").checked);
    } catch (err) {
      msg.className = "bad"; msg.textContent = "This browser can't open the page. Try an up-to-date Safari, Chrome or Edge.";
    }
  });

  (async function () {
    const saved = store.get();
    if (saved) {
      try {
        const key = await crypto.subtle.importKey("raw", Uint8Array.from(atob(saved), (c) => c.charCodeAt(0)),
          "AES-GCM", false, ["decrypt"]);
        await show(await open(key), true);
        return;
      } catch (e) { store.clear(); } // password changed since: ask again
    }
    $("lock").hidden = false;
    $("pw").focus();
  })();
})();
</script>
</body>
</html>
